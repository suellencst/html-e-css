<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabela 12</title>
</head>
<body>
     <div class="card">
        <h1>Fechamento de Vendas por Vendedor</h1>

        <table>
            <thead>
                <tr>
                    <th>Vendedor</th>
                    <th class="centro">Região</th>
                    <th class="direita">Vendas (un)</th>
                    <th class="direita">Total Faturado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ana Silva</td>
                    <td class="centro">Sudeste</td>
                    <td class="direita">142</td>
                    <td class="direita">R$ 56.800,00</td>
                </tr>
                <tr>
                    <td>Carlos Oliveira</td>
                    <td class="centro">Sul</td>
                    <td class="direita">98</td>
                    <td class="direita">R$ 39.200,00</td>
                </tr>
                <tr>
                    <td>Mariana Santos</td>
                    <td class="centro">Nordeste</td>
                    <td class="direita">115</td>
                    <td class="direita">R$ 46.000,00</td>
                </tr>
                <tr>
                    <td>Roberto Lima</td>
                    <td class="centro">Centro-Oeste</td>
                    <td class="direita">87</td>
                    <td class="direita">R$ 34.800,00</td>
                </tr>
            </tbody>
     <tfoot>
                <tr>
                    <td colspan="2">Total Geral</td>
                    <td class="direita">442</td>
                    <td class="direita">R$ 176.800,00</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
