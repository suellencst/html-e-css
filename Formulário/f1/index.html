<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Reserve sua Mesa</title>
</head>
<body>
    <div class="cabecalho">

    <h1>Reserve sua Mesa</h1>
    <h2>Por favor, preencha o formulário abaixo com atenção para que possamos
    <br>atendê-lo da melhor forma possível. Seja bem-vindo!</h2>
    </div>

    <form action="#" method="post">

  <div class="campo">
    <label for="nome">Nome Completo</label>
    <div class="nome-completo">
        <div>
            <input type="text" id="nome" name="nome" required>
            <small>Nome</small>
        </div>
        <div>
            <input type="text" id="sobrenome" name="sobrenome" required>
            <small>Sobrenome</small>
        </div>
    </div>
</div>
    <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="ex: myname@example.com" size="30" required>
    </div>

    <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" size="30" required>
    </div>

    <div class="campo">
    <label for="pessoas">Número de Pessoas </label>
    <input type="text" id="pessoas" name="pessoas" size="30" required>
    </div>

    <h3>Reserva</h3>

     <div class="campo">
        <label for="tipo">Tipo de Reserva</label>
        <select id="tipo" name="tipo" required>
                <option value="">Please Select</option>
                <option value="jantar">Jantar</option>
                <option value="almoco">Almoço</option>
                <option value="aniversario">Aniversário</option>
                <option value="outro">Outro</option>
            </select>       
     </div>

     <div class="campo">
         <label for="outro">Se "Outro" acima, especifique</label>
            <input type="text" id="outro" name="outro">
     </div>

     <div class="campo">
            <label for="pedidos">Pedidos Especiais</label>
            <textarea id="pedidos" name="pedidos" rows="2"></textarea>
    </div>

    <div class="rodape">
    <button type="submit">Enviar</button>
    </div>
    
</form>
</body>
</html>
