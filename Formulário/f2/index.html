<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário 2</title>
</head>
<body>
    <div class="formulario">
    <form action="" method="POST"> <!--POST / GET-->

       
        <div class="campo">
            <label for="nome">Nome Completo: </label>
            <input type="text" id="nome" name="nome"  size="20" required>
        </div>

         <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"  size="20" required>
        </div>
        
        <div class="campo">
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" size="20" required>
        </div>

        <div class="campo">
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" size="20" required>
        </div>

        <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" size="20" required>
        </div>

        <div class="campo">
            <label for="telefone">Telefone fixo ou celular:</label>
            <input type="tel" id="telefone" name="telefone" size="20" required>
        </div>

        <div class="campo">
            <label for="titulo-campo">Serviços em couro:</label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="100%-legitimo"> Bancos em couro - 100% Legítimo
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="misto"> Bancos em couro - Misto
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="100%-sintetico"> Bancos em couro - 100% Sintético
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="volante"> Volante em couro
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="manopla-coifa"> Revestimento da manopla e coifa 
            </label>

            <label class="opcao">
            <input type="checkbox" name="servicos" value="apoio-braco"> Revestimento de apoio de braço
            </label>

        </div>

        <div class="campo">
            <label for="titulo-campo">Restauração e tapeçaria:</label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="carros-antigos"> Restauração de carros antigos
            </label>

            <label class="opcao">
                <input type="checkbox" name="servicos" value="troca-teto"> Somente troca de teto
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="assoalho"> Somente troca do assoalho
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="bancos-ferragens"> Reparos em estrutura dos bancos e ferragens
            </label>

            
            <label class="opcao">
                <input type="checkbox" name="servicos" value="hidratacao"> Hidratação e higienização dos bancos 
            </label>

        </div>
        <div class="campo">
        <label>Acessórios:</label>

            <label class="opcao">
            <input type="checkbox" name="acessorios" value="kit-hidratacao"> Kit Hidratação p/ Couro
            </label>

            <label class="opcao">
            <input type="checkbox" name="acessorios" value="tapetes"> Tapetes personalizados
            </label>

            <label class="opcao">
            <input type="checkbox" name="acessorios" value="apoio-braco"> Adaptação de apoio de braço
            </label>
        </div>

        <div class="campo">
        <label for="tipo">Marca Fabricante</label>
        <select id="tipo" name="tipo" required>

        <option value="">Please Select</option>

        <option value="chevrolet">Chevrolet</option>

        <option value="mercedes">Mercedes</option>

        <option value="ferrari">Ferrari</option>

        <option value="jaguar">Jaguar</option>
        </select>
        </div>

        <div class="campo">
            <label for="nome-modelo">Nome Modelo:</label>
            <input type="text" id="modelo" name="modelo" size="20" required>
        </div>

        <div class="campo">
            <label for="ano-fabricacao">Ano de fabricação:</label>
            <input type="text" id="ano" name="ano" size="20" required>
        </div>

        <div class="campo">
            <label for="titulo-campo">Especifique a forma de pagamento</label>
            <label class="opcao">
                <input type="radio" name="pagamento" value="avista"> Á vista
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="corrente"> Depósito em conta corrente
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="banco"> Doc ou transferência bancaria
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="parcelado"> Parcelado até 4x no cartão de crédito
            </label>
            </div>

            <div class="campo">
                <label for="detalhes">Diga-nos com maior riqueza de detalhes o serviço de interesse:</label>
                <textarea id="detalhes" name="detalhes" rows="3" size="60" placeholder="Digite suas observações"></textarea>
            </div>

        <div class="botao">
            <button class="button" type="submit">Enviar formulário</button>
        </div>

    </form>
    </div>
</body>
</html>
